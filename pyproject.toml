[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daybreak-macos"
version = "0.1.0"
description = "Conservative update and relaunch coordination for running macOS apps"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
daybreak = "daybreak.cli:main"

[tool.setuptools.packages.find]
include = ["daybreak*"]
