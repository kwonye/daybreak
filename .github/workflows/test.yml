name: Test
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'examples/**'
      - 'scripts/**'
      - 'VERSION'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'app/**'
      - 'examples/**'
      - 'scripts/**'
      - 'VERSION'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  mac-app:
    # Build with the Liquid Glass SDK while testing on an earlier macOS release.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - name: Build and test the Swift app and engine
        working-directory: app
        run: |
          swift build
          swift test
      - name: Assemble the app bundle (universal, ad-hoc signed)
        run: ./scripts/build-app.sh
      - name: Verify the bundle and native CLI
        run: |
          codesign --verify --deep --strict --verbose=2 .build/Daybreak.app
          env -i PATH=/usr/bin:/bin .build/Daybreak.app/Contents/Helpers/daybreak status --state-dir "$RUNNER_TEMP/daybreak-state"
