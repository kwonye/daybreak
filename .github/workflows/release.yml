name: Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - 'examples/**'
      - 'scripts/**'
      - 'VERSION'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'app/**'
      - 'examples/**'
      - 'scripts/**'
      - 'VERSION'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  mac-app:
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check version
        id: version
        run: |
          version="$(./scripts/version)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Test
        run: swift test --package-path app
      - name: Check required signing secrets
        if: github.ref_type == 'tag'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in SPARKLE_PRIVATE_KEY MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
      - name: Import signing certificate into a temporary keychain
        if: github.ref_type == 'tag'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/evergreen-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          cert="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error::The certificate in MACOS_CERTIFICATE_P12_BASE64 is not a Developer ID Application certificate"
            exit 1
          fi
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Store notarization credentials
        if: github.ref_type == 'tag'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials evergreen-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$KEYCHAIN"
          echo "NOTARY_PROFILE=evergreen-notary" >> "$GITHUB_ENV"
      - name: Build release ZIP
        env:
          SPARKLE_FEED_URL: ${{ github.ref_type == 'tag' && format('{0}/{1}/releases/latest/download/appcast.xml', github.server_url, github.repository) || '' }}
        run: ./scripts/build-app.sh
      - name: Verify release bundle and CLI
        run: |
          codesign --verify --deep --strict --verbose=2 .build/Evergreen.app
          env -i PATH=/usr/bin:/bin .build/Evergreen.app/Contents/Helpers/evergreen status --config "$RUNNER_TEMP/evergreen-config.json" --state-dir "$RUNNER_TEMP/evergreen-state"
          unzip -t ".build/dist/Evergreen-$VERSION.zip"
      - name: Verify notarization
        if: github.ref_type == 'tag'
        run: |
          xcrun stapler validate .build/Evergreen.app
          spctl --assess --type execute --verbose .build/Evergreen.app
      - name: Generate and verify signed appcast
        if: github.ref_type == 'tag'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/generate-appcast.sh "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: Evergreen-${{ env.VERSION }}
          path: |
            .build/dist/Evergreen-${{ env.VERSION }}.zip
            .build/dist/appcast.xml
          include-hidden-files: true
          if-no-files-found: error
      - name: Delete temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
  publish:
    if: github.ref_type == 'tag'
    needs: mac-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.mac-app.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Evergreen-${{ env.VERSION }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Evergreen-$VERSION.zip" appcast.xml --repo "$GITHUB_REPOSITORY" --verify-tag --title "Evergreen $VERSION" --generate-notes
